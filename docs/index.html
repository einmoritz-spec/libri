<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#171b21" />
    <meta name="description" content="Libri — deine Bibliothek: scannen, sortieren, lesen." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap"
    />
    <!-- Verbindungen zu den Datenquellen früh aufbauen, damit der erste Scan
         nicht noch auf Namensauflösung und Handshake warten muss. -->
    <link rel="preconnect" href="https://www.googleapis.com" />
    <link rel="dns-prefetch" href="https://openlibrary.org" />
    <link rel="dns-prefetch" href="https://covers.openlibrary.org" />
    <title>Libri</title>
    <script>
      // Vor dem ersten Rendern gesetzt, damit beim Öffnen nie kurz das
      // falsche Erscheinungsbild aufblitzt.
      try {
        document.documentElement.setAttribute(
          'data-theme',
          localStorage.getItem('libri:theme') || 'dark'
        )
      } catch (e) {}
    </script>
    <style>
      html, body { margin: 0; height: 100%; background: #171b21; color: #e9e4da;
        font-family: system-ui, -apple-system, sans-serif; }
      #boot { padding: 40px 22px; max-width: 34em; line-height: 1.5; }
      #boot h1 { font-size: 19px; margin: 0 0 10px; }
      #boot p { color: #8d97a5; margin: 0 0 8px; font-size: 15px; }
      #boot code { color: #e0a93b; font-size: 13px; word-break: break-all; }
    </style>
    <script type="module" crossorigin src="./assets/index-DiuwAvX6.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Cn5w-uRK.css">
  <link rel="manifest" href="./manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="./registerSW.js"></script></head>
  <body>
    <!-- Dieser Platzhalter wird von React sofort überschrieben. Bleibt er stehen,
         wurde das JavaScript nicht geladen — dann steht hier auch der Grund. -->
    <div id="root">
      <div id="boot">
        <h1>Libri startet…</h1>
        <p>Bleibt diese Meldung stehen, konnte die App nicht geladen werden.</p>
      </div>
    </div>
    <script>
      window.addEventListener('error', function (e) {
        var boot = document.getElementById('boot')
        if (!boot) return
        var what = e.target && e.target.src ? e.target.src : (e.message || 'unbekannt')
        boot.innerHTML =
          '<h1>Libri konnte nicht starten</h1>' +
          '<p>Fehlgeschlagen beim Laden von:</p><p><code>' +
          String(what).replace(/</g, '&lt;') + '</code></p>' +
          '<p>Zeig diese Zeile weiter, damit sich der Fehler einordnen lässt.</p>'
      }, true)
    </script>
  </body>
</html>
